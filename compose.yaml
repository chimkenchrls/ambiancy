services:
  web:
    build:
      context: ./web
      args:
        VITE_MEDIA_BASE_URL: http://localhost:8081
    ports:
      - "8080:80"
    depends_on:
      - media

  media:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./media:/usr/share/nginx/html:ro,z
      - ./deploy/media.nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
