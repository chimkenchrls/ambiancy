server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    # The web app runs on another address, and the browser only lets it read
    # audio from here if this server says so.
    add_header Access-Control-Allow-Origin "*" always;
    # No "always" here: a 404 must not be cached, or a retry after the file
    # appears would keep getting the remembered failure.
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
}
